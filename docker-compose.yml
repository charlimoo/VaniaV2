

x-base-environment: &base-environment
  env_file:
    - .env
  entrypoint: ["/app/start.sh"]
  restart: always

services:
  # --- 1. WEB APPLICATION (Backend) ---
  app:
    # uncomment if you wanna build the codes.
    # build: ./backend
    
    # comment out if you wanna use the image
    image: charlievespera/vaniaapp-backend:latest

    container_name: vania_app
    <<: *base-environment
    command: 'gunicorn core.asgi:application --preload --timeout 120 -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000'
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_started}
      qdrant: {condition: service_started}
      minio: {condition: service_started}

  # --- 2. FRONTEND (Next.js) ---
  frontend:
    build: ./frontend
    container_name: vania_frontend
    environment:
      - 'NEXT_PUBLIC_API_URL=http://localhost:8000'
      - 'INTERNAL_API_URL=${INTERNAL_API_URL}'
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - app

  # --- 3. BACKGROUND WORKER (Celery) ---
  worker:
    build: ./backend
    container_name: vania_worker
    <<: *base-environment
    command: celery -A core worker -l info
    depends_on:
      - app
      - cache
      - db

  # --- 4. SCHEDULER (Celery Beat) ---
  beat:
    build: ./backend
    container_name: vania_beat
    <<: *base-environment
    command: celery -A core beat -l info
    depends_on:
      - app
      - cache
      - db

  # --- INFRASTRUCTURE ---
  db:
    image: postgres:15-alpine
    container_name: vania_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  cache:
    image: redis:7-alpine
    container_name: vania_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: 'quay.io/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1'
    container_name: vania_minio
    command: 'server /data --console-address ":9001"'
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
      - 'MINIO_SERVER_URL=${AWS_S3_CUSTOM_MAIN_DOMAIN}'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - 'minio_data:/data'
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.minio.rule=Host(`${AWS_S3_CUSTOM_MAIN_DOMAIN}`)'
      - "traefik.http.routers.minio.entrypoints=https"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
    restart: always
  createbuckets:
    image: 'quay.io/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1'
    restart: "no"
    depends_on:
      - minio
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
    entrypoint: "/bin/sh -c \" until /usr/bin/mc alias set myminio http://minio:9000 \\${MINIO_ROOT_USER} \\${MINIO_ROOT_PASSWORD}; do\n  echo 'Waiting for MinIO...';\n  sleep 2;\ndone; /usr/bin/mc mb myminio/vania-media || true; /usr/bin/mc anonymous set public myminio/vania-media; exit 0; \"\n"

  qdrant:
    image: qdrant/qdrant
    container_name: vania_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data: