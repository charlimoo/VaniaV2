[pytest]
# Path to your Django settings
DJANGO_SETTINGS_MODULE = core.settings

# File patterns to look for tests
python_files = tests.py test_*.py *_tests.py

# CLI Arguments:
# --reuse-db: Don't recreate the DB every time
# --nomigrations: Skip running migrations (faster)
# -p no:warnings: Quiet down 3rd party library warnings
addopts = 
    --reuse-db 
    --nomigrations 
    -p no:warnings 
    --strict-markers

# Directories to search
testpaths = tests

# Markers for categorizing tests
markers =
    asyncio: mark a test as an asyncio coroutine
    billing: tests related to wallet, invoices and logic
    agents: tests for ServiceAgent and Agno integration
    slow: tests that take a long time to run