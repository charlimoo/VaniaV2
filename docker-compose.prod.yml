x-base-environment:
  env_file:
    - .env
  entrypoint:
    - /app/start.sh
  restart: always
services:
  app:
    build: ./backend
    # image: 'charlievespera/vaniaapp-backend:latest'
    env_file:
      - .env
    entrypoint:
      - /app/start.sh
    restart: always
    command: 'gunicorn core.asgi:application --preload --timeout 120 -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000'
    ports:
      - '8001:8000'
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
  frontend:
    build: ./frontend
    # image: 'charlievespera/vaniaapp-frontend:latest'
    container_name: vania_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} 
    env_file:
      - .env
    ports:
      - '3000:3000'
    restart: always
    depends_on:
      - app
  worker:
    build: ./backend
    # image: 'charlievespera/vaniaapp-backend:latest'
    env_file:
      - .env
    entrypoint:
      - /app/start.sh
    restart: always
    command: 'celery -A core worker -l info'
    depends_on:
      - app
      - cache
      - db
  beat:
    build: ./backend
    # image: 'charlievespera/vaniaapp-backend:latest'
    env_file:
      - .env
    entrypoint:
      - /app/start.sh
    restart: always
    command: 'celery -A core beat -l info'
    depends_on:
      - app
      - cache
      - db
  db:
    image: 'postgres:15-alpine'
    container_name: vania_postgres
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
  cache:
    image: 'redis:7-alpine'
    container_name: vania_redis
    command: 'redis-server --appendonly yes'
    volumes:
      - 'redis_data:/data'
    restart: always
  minio:
    image: 'quay.io/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1'
    container_name: vania_minio
    command: 'server /data --console-address ":9001"'
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
      - 'MINIO_SERVER_URL=https://${AWS_S3_CUSTOM_MAIN_DOMAIN}'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - 'minio_data:/data'
    restart: always
  createbuckets:
    image: 'quay.io/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1'
    restart: "no"
    depends_on:
      - minio
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
    entrypoint: "/bin/sh -c \" until /usr/bin/mc alias set myminio http://minio:9000 \\${MINIO_ROOT_USER} \\${MINIO_ROOT_PASSWORD}; do\n  echo 'Waiting for MinIO...';\n  sleep 2;\ndone; /usr/bin/mc mb myminio/vania-media || true; /usr/bin/mc anonymous set public myminio/vania-media; exit 0; \"\n"
  qdrant:
    image: qdrant/qdrant
    container_name: vania_qdrant
    volumes:
      - 'qdrant_data:/qdrant/storage'
    restart: always
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  qdrant_data: null
